    <script>
        function handleAdminLogin(e, mode) {
            if (e) e.preventDefault();
            var btnText = document.getElementById("btnText");
            var btnHanText = document.getElementById("btnHanText");
            var user = document.getElementById("adminUser").value || "(empty)";
            var pass = document.getElementById("adminPass").value || "(empty)";

            if (mode === 'Sign in with HAN SSO') {
                btnHanText.textContent = "Connecting to HAN SSO Server...";
            } else {
                btnText.textContent = "Authenticating...";
            }

            setTimeout(function() {
                btnText.textContent = "Sign In";
                btnHanText.textContent = "Sign in with HAN SSO";
                
                document.getElementById("adminUser").value = "";
                document.getElementById("adminPass").value = "";

                console.log("[SECURITY HONEYPOT] Attempted Login via (" + mode + "):", {
                    timestamp: new Date().toISOString(),
                    attemptedUser: user,
                    attemptedPass: pass,
                    userAgent: navigator.userAgent
                });
            }, 1100);
        }
    </script>
