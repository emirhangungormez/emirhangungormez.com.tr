    <script>
        function handleAdminLogin(e, mode) {
            if (e) e.preventDefault();
            var btnText = document.getElementById("btnText");
            var btnHanText = document.getElementById("btnHanText");
            var user = document.getElementById("adminUser").value || "(boş)";
            var pass = document.getElementById("adminPass").value || "(boş)";

            if (mode === 'HAN ile Giriş Yap') {
                btnHanText.textContent = "HAN SSO Sunucusuna Bağlanılıyor...";
            } else {
                btnText.textContent = "Kimlik Doğrulanıyor...";
            }

            setTimeout(function() {
                btnText.textContent = "Giriş Yap";
                btnHanText.textContent = "HAN ile Giriş Yap";
                
                document.getElementById("adminUser").value = "";
                document.getElementById("adminPass").value = "";

                console.log("[SECURITY HONEYPOT] Attempted Login via (" + mode + "):", {
                    timestamp: new Date().toISOString(),
                    attemptedUser: user,
                    attemptedPass: pass,
                    userAgent: navigator.userAgent
                });
            }, 1100);
        }
    </script>
