    <style>
        .tp-pure-page {
            min-height: calc(100vh - 180px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }

        .tp-pure-frame {
            max-width: 42rem;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* Headline: PP Mori Site Font Only */
        .tp-headline-title {
            font-family: "PP Mori", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 2.4rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: inherit;
            margin: 0 0 1.8rem 0;
            line-height: 1.15;
        }

        /* Thread Messages Stream */
        .tp-stream-thread {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            max-height: 340px;
            overflow-y: auto;
            margin-bottom: 1.6rem;
            padding-right: 0.4rem;
            scroll-behavior: smooth;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .tp-stream-thread:empty {
            display: none;
            margin-bottom: 0;
        }

        .tp-stream-thread::-webkit-scrollbar {
            width: 4px;
        }
        .tp-stream-thread::-webkit-scrollbar-thumb {
            background: currentColor;
            opacity: 0.15;
            border-radius: 2px;
        }

        .tp-stream-messages {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            width: 100%;
        }

        .tp-row {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            animation: tpFadeIn 0.2s ease forwards;
        }

        @keyframes tpFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tp-row--user {
            align-self: flex-end;
            max-width: 85%;
        }

        .tp-row--ai {
            align-self: flex-start;
            width: 100%;
        }

        .tp-role-label {
            font-family: "PP Mori", sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            opacity: 0.45;
            color: inherit;
        }

        .tp-row--user .tp-role-label {
            text-align: right;
        }

        .tp-bubble-body {
            font-family: "PP Mori", sans-serif;
            font-size: 0.98rem;
            line-height: 1.65;
            color: inherit;
            word-break: break-word;
        }

        .tp-row--user .tp-bubble-body {
            background: rgba(17, 20, 20, 0.05);
            border: 1px solid rgba(17, 20, 20, 0.1);
            padding: 0.85rem 1.15rem;
            border-radius: 16px;
            border-bottom-right-radius: 4px;
        }

        .dark-mode .tp-row--user .tp-bubble-body {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .tp-row--ai .tp-bubble-body {
            background: transparent;
            border-left: 2px solid rgba(17, 20, 20, 0.25);
            padding: 0.2rem 0 0.2rem 1.0rem;
        }

        .dark-mode .tp-row--ai .tp-bubble-body {
            border-left-color: rgba(255, 255, 255, 0.3);
        }

        .tp-bubble-body a {
            color: inherit;
            font-weight: 600;
            text-decoration: underline;
        }

        .tp-bubble-body strong {
            color: inherit;
            font-weight: 600;
        }

        .typing-dots {
            display: inline-flex;
            gap: 4px;
            padding: 0.4rem 0;
        }

        .typing-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.4;
            animation: pulseDot 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulseDot {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* TakeProfit Card Component */
        .tp-input-box-card {
            position: relative;
            background: #2b2b2e;
            border-radius: 20px;
            padding: 1.1rem 1.2rem 1.1rem 1.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            box-shadow: none;
            min-height: 104px;
        }

        .light-mode .tp-input-box-card,
        body:not(.dark-mode) .tp-input-box-card {
            background: #e1e1e5;
            color: #111414;
            box-shadow: none;
        }

        .dark-mode .tp-input-box-card {
            background: #27272a;
            color: #ffffff;
            box-shadow: none;
        }

        .tp-input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.4rem;
            padding-right: 96px;
        }

        .tp-field-label {
            font-family: "PP Mori", sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            color: inherit;
            opacity: 0.6;
            letter-spacing: 0.01em;
        }

        .tp-main-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1.45rem;
            font-family: "PP Mori", sans-serif;
            color: inherit;
            caret-color: #8b5cf6;
            padding: 0.1rem 0;
        }

        .tp-main-input::placeholder {
            color: inherit;
            opacity: 0.38;
        }

        /* Exact Replica ISO L-Shaped Purple Enter Button Container */
        .tp-exact-l-enter-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            bottom: 8px;
            width: 88px;
            height: calc(100% - 16px);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 3;
            transition: transform 0.15s ease, filter 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tp-exact-l-enter-btn:hover {
            transform: scale(1.03);
            filter: brightness(1.08);
        }

        .tp-exact-l-enter-btn svg {
            width: 88px;
            height: 100%;
            display: block;
        }

            header .nav__links {

            header .nav__theme__text {

            .tp-pure-page {
                height: calc(100dvh - 58px);
                min-height: 0;
                padding: 0;
                align-items: stretch;
            }
            .tp-pure-frame {
                position: relative;
                max-width: none;
                height: 100%;
                margin: 0;
                padding: 0 14px max(10px, env(safe-area-inset-bottom));
                overflow: hidden;
            }
            .tp-headline-title {
                flex: 0 0 auto;
                font-size: 24px !important;
                font-weight: 500;
                margin: 0;
                padding: 16px 2px 14px;
            }
            .tp-stream-thread,
            .tp-stream-thread:empty {
                position: absolute;
                top: 58px;
                left: 14px;
                right: 14px;
                bottom: 84px;
                display: flex;
                max-height: none !important;
                min-height: 0;
                margin: 0;
                padding: 8px 2px 12px;
                overflow-y: auto;
                overscroll-behavior: contain;
            }
            .tp-stream-messages {
                min-height: 100%;
            }
            .tp-stream-messages::before {
                content: "";
                margin-top: auto;
            }
            .tp-stream-messages .tp-row {
                flex: 0 0 auto;
            }
            .tp-row--user {
                max-width: 88%;
            }
            .tp-role-label {
                font-size: 11px !important;
                letter-spacing: .03em;
            }
            .tp-bubble-body {
                font-size: 16px !important;
                line-height: 1.55;
            }
            .tp-row--user .tp-bubble-body {
                padding: 10px 14px;
                border-radius: 15px;
                border-bottom-right-radius: 4px;
            }
            .tp-input-box-card {
                position: absolute;
                left: 14px;
                right: 14px;
                bottom: max(10px, env(safe-area-inset-bottom));
                min-height: 64px;
                border-radius: 18px;
                padding: 0.65rem 0.75rem 0.65rem 1rem;
            }
            .tp-main-input {
                font-size: 16px !important;
                line-height: 1.4;
            }
            .tp-field-label {
                display: none;
            }
            .tp-exact-l-enter-btn {
                width: 56px;
            }
            .tp-exact-l-enter-btn svg {
                width: 56px;
            }
            .tp-input-group {
                padding-right: 60px;
                gap: 0;
            }
            body:has(.cookie-consent) .tp-input-box-card {
                bottom: calc(150px + env(safe-area-inset-bottom));
            }
            .footer {
                display: none;
            }
        }
    </style>

    <script>
        var chatHistory = [];

        document.getElementById('chatBody').addEventListener('wheel', function (event) {
            if (this.scrollHeight <= this.clientHeight) return;
            event.preventDefault();
            event.stopPropagation();
            this.scrollTop += event.deltaY;
        }, { passive: false });

        function getChatMessages() {
            var chatBody = document.getElementById('chatBody');
            var messages = chatBody.querySelector('.tp-stream-messages');
            if (!messages) {
                messages = document.createElement('div');
                messages.className = 'tp-stream-messages';
                chatBody.appendChild(messages);
            }
            return messages;
        }

        function appendMessage(role, text) {
            var chatBody = document.getElementById('chatBody');
            var messages = getChatMessages();
            var row = document.createElement('div');
            row.className = 'tp-row ' + (role === 'user' ? 'tp-row--user' : 'tp-row--ai');
            
            var label = document.createElement('span');
            label.className = 'tp-role-label';
            label.textContent = role === 'user' ? 'SİZ' : 'SANAL EMİRHAN';

            var body = document.createElement('div');
            body.className = 'tp-bubble-body';
            body.innerHTML = text;

            row.appendChild(label);
            row.appendChild(body);
            messages.appendChild(row);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showTypingIndicator() {
            var chatBody = document.getElementById('chatBody');
            var messages = getChatMessages();
            var row = document.createElement('div');
            row.id = 'typingIndicatorRow';
            row.className = 'tp-row tp-row--ai';
            
            var label = document.createElement('span');
            label.className = 'tp-role-label';
            label.textContent = 'SANAL EMİRHAN';

            var body = document.createElement('div');
            body.className = 'tp-bubble-body';
            body.innerHTML = '<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';

            row.appendChild(label);
            row.appendChild(body);
            messages.appendChild(row);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function removeTypingIndicator() {
            var el = document.getElementById('typingIndicatorRow');
            if (el) el.remove();
        }

        function createRichLinkCard(url, title) {
            var domain = '';
            try {
                var parsedUrl = new URL(url, window.location.href);
                if (parsedUrl.hostname.replace('www.', '') === 'emirhangungormez.com.tr' && parsedUrl.pathname.endsWith('/blog.html')) {
                    parsedUrl = new URL('blog.html', window.location.href);
                }
                url = parsedUrl.href;
                domain = parsedUrl.protocol === 'file:' ? 'blog' : parsedUrl.hostname.replace('www.', '');
            } catch(e) {
                domain = 'link';
            }

            var targetAttributes = url.startsWith('file:') || url.startsWith(window.location.origin)
                ? ''
                : ' target="_blank" rel="noopener noreferrer"';

            var iconSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';

            if (url.includes('steampowered.com') || url.includes('steam')) {
                iconSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.008l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.03 4.524 4.524s-2.03 4.525-4.524 4.525c-.204 0-.405-.017-.601-.044l-4.062 2.87c.005.062.008.126.008.191 0 1.834-1.488 3.322-3.323 3.322-1.636 0-3.003-1.185-3.275-2.753L.328 17.653C1.835 21.439 5.602 24 9.979 24c6.627 0 12-5.373 12-12s-5.373-12-12-12z"/></svg>';
            } else if (url.includes('github.com')) {
                iconSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>';
            }

            return '<br><a href="' + url + '"' + targetAttributes + ' class="tp-rich-link-card">' +
                   '<span class="tp-rich-link-icon">' + iconSvg + '</span>' +
                   '<span class="tp-rich-link-title">' + (title || 'Bağlantıyı Aç') + '</span>' +
                   '<span class="tp-rich-link-domain">' + domain + ' ↗</span>' +
                   '</a>';
        }

        function formatAiReply(text) {
            if (!text) return "";
            var formatted = text;

            formatted = formatted.replace(/<a\s+href=['"]([^'"]+)['"][^>]*>(.*?)<\/a>/gi, function(match, url, title) {
                return createRichLinkCard(url, title);
            });

            formatted = formatted.replace(/\[(.*?)\]\((https?:\/\/[^\s\)]+)\)/g, function(match, title, url) {
                return createRichLinkCard(url, title);
            });

            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
            
            if (!formatted.startsWith('<p>') && !formatted.startsWith('<a')) {
                formatted = '<p>' + formatted + '</p>';
            }

            return formatted;
        }

        async function handleChatSubmit(e) {
            e.preventDefault();
            var input = document.getElementById('chatInput');
            var text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            showTypingIndicator();

            try {
                var response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: chatHistory.slice(-6)
                    })
                });

                removeTypingIndicator();

                if (response.ok) {
                    var data = await response.json();
                    var reply = data.reply || "Yanıt alınamadı.";
                    
                    var formattedReply = formatAiReply(reply);
                    appendMessage('ai', formattedReply);

                    chatHistory.push({ role: 'user', text: text });
                    chatHistory.push({ role: 'ai', text: data.reply });
                } else {
                    var errData = await response.json().catch(function() { return {}; });
                    if (errData.error && (errData.error.includes("GEMINI_API_KEY") || errData.error.includes("GROQ_API_KEY"))) {
                        appendMessage('ai', "<p>⚠️ <strong>Sanal Emirhan hazırlanıyor:</strong> Cloudflare Pages ayarlarında <code>GROQ_API_KEY</code> veya <code>GEMINI_API_KEY</code> henüz tanımlanmadı. Lütfen Cloudflare panelinden API anahtarını ekleyin.</p>");
                    } else {
                        appendMessage('ai', "<p>Şu an bir bağlantı sorunu var. Lütfen daha sonra tekrar deneyin veya <a href='mailto:han23studio@gmail.com'>han23studio@gmail.com</a> adresi üzerinden ulaşın.</p>");
                    }
                }
            } catch (err) {
                removeTypingIndicator();
                appendMessage('ai', "<p>Bağlantı kurulamadı. Doğrudan iletişim için: <strong>han23studio@gmail.com</strong></p>");
            }
        }
    </script>
